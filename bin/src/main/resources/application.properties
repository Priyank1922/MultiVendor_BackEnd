spring.application.name=Ecommerce
server.port=8080

# MySQL Local Connection Configuration
# (Auto-creates the database 'MultiVendor' if it does not exist)
spring.datasource.url=jdbc:mysql://localhost:3306/MultiVendor?createDatabaseIfNotExist=true
spring.datasource.username=root
# WARNING: Change the password below to match your local MySQL password if it is not 'priyank1922'
spring.datasource.password=priyank1922
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
# Set to 'create' to automatically clear/wipe all tables on application startup.
# Once started once, you can change this back to 'update' to persist new records.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
